spring.application.name=aromastudio-api

# Carga secretos locales si el archivo existe (no se commitea; en Render se usa MAIL_PASSWORD).
spring.config.import=optional:file:./secret-mail.properties

# Server
server.port=${PORT:8080}

# Database - usa PostgreSQL si DATABASE_URL existe, sino H2 local
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/aromastudio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 console (solo dev local)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:aromastudio-secret-key-change-in-production-2024-very-long-key-at-least-256-bits}
app.jwt.expiration-ms=86400000

# Admin default credentials
app.admin.email=${ADMIN_EMAIL:admin@aromastudio.pe}
app.admin.password=${ADMIN_PASSWORD:admin123}
# Admins extra (opcional). Formato: correo:clave:Nombre;correo2:clave2:Nombre2
app.extra-admins=${EXTRA_ADMINS:}

# Business config defaults
app.config.courier-cost-per-kg=9.0
app.config.exchange-rate=3.4
app.config.target-margin=100.0
app.config.min-order-usd=350.0
app.config.box-weight-g=300.0
app.config.perfumes-per-box=4
app.config.yape-number=903250695
app.config.repack-cost-per-box=3.5
app.config.zimaxx-priority=true

# Multipart (subida de Excel de proveedores)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Apify (rellenar fotos de perfumes nuevos por nombre). Token como variable de entorno, NUNCA en el codigo.
apify.token=${APIFY_TOKEN:}
apify.image-actor=${APIFY_IMAGE_ACTOR:tnudF2IxzORPhg4r8}
# Resultados por perfume al buscar foto (mas = mas acierto pero mas costo Apify; $1.90/1000 imagenes)
apify.image-results=${APIFY_IMAGE_RESULTS:6}

# Keep-alive
app.keep-alive.url=${KEEP_ALIVE_URL:}

# Email (notificacion de nuevos pedidos)
# Remitente: aroma@aromastudiope.com (Namecheap Private Email). Solo falta configurar MAIL_PASSWORD.
# NUNCA pongas la contrasena aqui (no se commitea): usala como variable de entorno MAIL_PASSWORD.
spring.mail.host=${MAIL_HOST:mail.privateemail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:aroma@aromastudiope.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
# Envio por API HTTP (Resend) — necesario en Render porque el SMTP saliente esta bloqueado.
# Si RESEND_API_KEY esta puesta, se usa Resend; si no, se intenta SMTP (solo funciona en local).
resend.api.key=${RESEND_API_KEY:}

# Destinatarios de la notificacion (coma-separados) y remitente
app.notify.emails=${NOTIFY_EMAILS:yanfilybacatorres@gmail.com,angelanayacenteno134@gmail.com}
app.notify.from=${MAIL_FROM:aroma@aromastudiope.com}
