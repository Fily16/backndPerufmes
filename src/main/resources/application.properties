spring.application.name=aromastudio-api

# Server
server.port=${PORT:8080}

# Database - usa PostgreSQL si DATABASE_URL existe, sino H2 local
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/aromastudio;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

# H2 console (solo dev local)
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET:aromastudio-secret-key-change-in-production-2024-very-long-key-at-least-256-bits}
app.jwt.expiration-ms=86400000

# Admin default credentials
app.admin.email=${ADMIN_EMAIL:admin@aromastudio.pe}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Business config defaults
app.config.courier-cost-per-kg=7.0
app.config.exchange-rate=3.4
app.config.target-margin=100.0
app.config.min-order-usd=350.0
app.config.box-weight-g=300.0
app.config.perfumes-per-box=4
app.config.yape-number=903250695

# Keep-alive
app.keep-alive.url=${KEEP_ALIVE_URL:}
